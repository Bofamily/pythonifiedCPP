name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: linux-gcc
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: linux-clang
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: windows-msvc

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S .

    - name: Build
      run: cmake --build build --config Release

    - name: Stage release binary
      shell: bash
      run: |
        mkdir -p release-assets
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          cp build/Release/pythonifiedCPP.exe "release-assets/pythonifiedCPP-${{ matrix.artifact_name }}.exe"
        else
          cp build/pythonifiedCPP "release-assets/pythonifiedCPP-${{ matrix.artifact_name }}"
        fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: pythonifiedCPP-${{ matrix.artifact_name }}
        path: release-assets/*
        if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: pythonifiedCPP-*
        path: release-assets
        merge-multiple: true

    - name: Create tagged GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ github.sha }}
        name: Build ${{ github.run_number }}
        files: release-assets/*
        generate_release_notes: true
